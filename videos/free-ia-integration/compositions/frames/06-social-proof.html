  <div data-hf-id="hf-purn" id="root" data-composition-id="06-social-proof" data-duration="9.303" data-width="1920" data-height="1080">

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });
    window.__timelines = window.__timelines || {};
    window.__timelines["06-social-proof"] = tl;

    const DURATION = 8.307;

    const cardBlock = document.getElementById("sp-card-block");
    const glow = document.getElementById("sp-glow");
    const sweep = document.getElementById("sp-sweep");
    const rule = document.getElementById("sp-rule");

    // ── Scene 1 (0.0–2.2s) — "Le plus beau changement" ──
    // The proof card slides up + crossfades in with one restrained move (waterfall-entry,
    // single element, power3), landing dead-center. Glow blooms behind on the same settle.
    const REVEAL_START = 0.15;
    const REVEAL_DUR = 0.9;

    tl.fromTo(cardBlock,
      { opacity: 0, y: 72 },
      { opacity: 1, y: 0, duration: REVEAL_DUR, ease: "power3.out" },
      REVEAL_START
    );

    // ambient-glow-bloom (hero-bloom form) — lands with the card's settle as ONE beat
    const GLOW_PEAK = 0.22;
    tl.fromTo(glow,
      { opacity: 0, scale: 0.86 },
      { opacity: GLOW_PEAK, scale: 1, duration: REVEAL_DUR, ease: "power2.out" },
      REVEAL_START
    );

    // ── Scene 2 (2.2–5.0s) — "La nuit… le matin" ── held read.
    // The Vérifié badge scintillates once: a single-pass tile-strong sheen crosses the card,
    // then rests. This is the one voltage beat.
    const SWEEP_START = 3.0;
    const SWEEP_DUR = 1.25;
    tl.fromTo(sweep,
      { x: -320, opacity: 0 },
      { x: 260, opacity: 0.30, duration: SWEEP_DUR * 0.55, ease: "none" },
      SWEEP_START
    );
    tl.to(sweep,
      { x: 1120, opacity: 0, duration: SWEEP_DUR * 0.45, ease: "power1.in" },
      SWEEP_START + SWEEP_DUR * 0.55
    );

    // ── Scene 3 (5.0–8.307s) — "plus de page blanche" ── full hold.
    // A neutral hairline rule draws in beneath the card to confirm the cite line; nothing else moves.
    tl.fromTo(rule,
      { scaleX: 0 },
      { scaleX: 1, duration: 0.7, ease: "power2.out" },
      5.15
    );

    // Bounded ambient breathe on the glow — the only sustained life during the held frame.
    const glowPhase = { p: 0 };
    const BREATHE_START = REVEAL_START + REVEAL_DUR; // 1.05s
    const BREATHE_DUR = DURATION - BREATHE_START;
    const BREATHE_CYCLES = BREATHE_DUR / 3.2; // ~3.2s per breath
    const OPACITY_AMP = 0.03;
    const SCALE_AMP = 0.014;
    tl.to(glowPhase, {
      p: Math.PI * 2 * BREATHE_CYCLES,
      duration: BREATHE_DUR,
      ease: "none",
      onUpdate: () => {
        const s = Math.sin(glowPhase.p);
        glow.style.opacity = String(GLOW_PEAK + s * OPACITY_AMP);
        glow.style.transform = `scale(${1 + s * SCALE_AMP})`;
      }
    }, BREATHE_START);
  </script>
