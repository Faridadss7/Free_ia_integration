<template>
  <style>
    @font-face { font-family: "Inter"; font-weight: 400; font-style: normal; font-display: block; src: url("assets/fonts/Inter-400.woff2") format("woff2"); }
    @font-face { font-family: "Inter"; font-weight: 700; font-style: normal; font-display: block; src: url("assets/fonts/Inter-700.woff2") format("woff2"); }
    @font-face { font-family: "JetBrains Mono"; font-weight: 400; font-style: normal; font-display: block; src: url("assets/fonts/JetBrainsMono-400.woff2") format("woff2"); }
    @font-face { font-family: "JetBrains Mono"; font-weight: 500; font-style: normal; font-display: block; src: url("assets/fonts/JetBrainsMono-700.woff2") format("woff2"); }

    #root {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
      container-type: size;
      overflow: hidden;
    }

    .ink-ground {
      position: absolute;
      inset: 0;
      background: #030712;
    }

    .terminal-stage {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-top: 200px;
    }

    .prompt-line {
      display: flex;
      align-items: baseline;
      font-family: "JetBrains Mono", monospace;
      font-size: 32px;
      font-weight: 400;
      color: #f8fafc;
      white-space: pre;
      margin-bottom: 48px;
    }

    .cursor {
      display: inline-block;
      width: 14px;
      height: 34px;
      background: #f8fafc;
      vertical-align: -4px;
      margin-left: 2px;
    }

    .modules-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 55%;
      margin-bottom: 56px;
    }

    .module-line {
      font-family: "JetBrains Mono", monospace;
      font-size: 28px;
      font-weight: 400;
      color: #f8fafc;
      opacity: 0;
    }

    .check-mark {
      color: #d97706;
    }

    .ready-stage {
      position: relative;
      display: inline-block;
    }

    .ready-glow {
      position: absolute;
      inset: -280px;
      background: radial-gradient(circle, rgba(217, 119, 6, 0.4) 0%, transparent 65%);
      opacity: 0;
      z-index: 1;
    }

    .ready-text {
      position: relative;
      z-index: 2;
      font-family: "JetBrains Mono", monospace;
      font-size: 38px;
      font-weight: 700;
      color: #f8fafc;
      letter-spacing: 0.08em;
      opacity: 0;
    }
  </style>

  <div data-hf-id="hf-byie" id="root" data-composition-id="01-boot-sequence" data-duration="5.363" data-width="1920" data-height="1080">
    <div data-hf-id="hf-4x6f" class="clip ink-ground" data-start="0" data-duration="5.363" data-track-index="0"></div>

    <div data-hf-id="hf-gkqv" class="clip terminal-stage" data-start="0" data-duration="5.363" data-track-index="1">
      <div data-hf-id="hf-lowh" class="prompt-line">
        <span data-hf-id="hf-m8zk" id="prompt-text"></span><span data-hf-id="hf-fwxv" class="cursor" id="cursor"></span>
      </div>

      <div data-hf-id="hf-ab2x" class="modules-container">
        <div data-hf-id="hf-3w6t" class="module-line" id="module-1">[ ] deepseek-r1 (128 t/s)</div>
        <div data-hf-id="hf-71kl" class="module-line" id="module-2">[ ] claude-3.5-sonnet &amp; cursor</div>
        <div data-hf-id="hf-wx07" class="module-line" id="module-3">[ ] cluster vibecoding (0€/mois)</div>
      </div>

      <div data-hf-id="hf-6qmo" class="ready-stage">
        <div data-hf-id="hf-zeum" class="ready-glow" id="ready-glow"></div>
        <div data-hf-id="hf-i0g0" class="ready-text" id="ready-text">CLUSTER INITIALISÉ · 0€ D'ABONNEMENT</div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });
    window.__timelines = window.__timelines || {};
    window.__timelines["01-boot-sequence"] = tl;

    const DURATION = 4.859;

    // Scene 1: Typing sequence with context-sensitive cursor
    const SEQUENCE = [
      { t: 0, text: "", color: "#f8fafc" },
      { t: 0.15, text: ">", color: "#f8fafc" },
      { t: 0.25, text: "> ", color: "#f8fafc" },
      { t: 0.35, text: "> i", color: "#f8fafc" },
      { t: 0.42, text: "> in", color: "#f8fafc" },
      { t: 0.49, text: "> ini", color: "#f8fafc" },
      { t: 0.56, text: "> init", color: "#f8fafc" },
      { t: 0.63, text: "> initi", color: "#f8fafc" },
      { t: 0.70, text: "> initia", color: "#f8fafc" },
      { t: 0.77, text: "> initial", color: "#f8fafc" },
      { t: 0.84, text: "> initializ", color: "#f8fafc" },
      { t: 0.91, text: "> initializin", color: "#f8fafc" },
      { t: 0.98, text: "> initializing", color: "#f8fafc" },
      { t: 1.05, text: "> initializing ", color: "#f8fafc" },
      { t: 1.12, text: "> initializing a", color: "#f8fafc" },
      { t: 1.19, text: "> initializing ai", color: "#38bdf8" },
      { t: 1.26, text: "> initializing ai ", color: "#f8fafc" },
      { t: 1.33, text: "> initializing ai w", color: "#f8fafc" },
      { t: 1.40, text: "> initializing ai workspace…", color: "#f8fafc" }
    ];

    function entryAt(time) {
      for (let i = SEQUENCE.length - 1; i >= 0; i--) {
        if (time >= SEQUENCE[i].t) return SEQUENCE[i];
      }
      return SEQUENCE[0];
    }

    const promptText = document.getElementById("prompt-text");
    const cursor = document.getElementById("cursor");

    const driver = { t: 0 };
    tl.to(driver, {
      t: 1.4,
      duration: 1.4,
      ease: "none",
      onUpdate: () => {
        const entry = entryAt(driver.t);
        promptText.textContent = entry.text;
        cursor.style.background = entry.color;
      }
    }, 0);

    // Cursor blink
    const blink = { p: 0 };
    const BLINK_CYCLES = 8;
    tl.to(blink, {
      p: Math.PI * 2 * BLINK_CYCLES,
      duration: DURATION,
      ease: "none",
      onUpdate: () => {
        cursor.style.opacity = Math.sin(blink.p) > 0 ? "1" : "0";
      }
    }, 0);

    // Scene 2: Module checks (1.4–3.4s)
    const modules = [
      { el: document.getElementById("module-1"), text: "<span class='check-mark'>✓</span> claude code", t: 1.5 },
      { el: document.getElementById("module-2"), text: "<span class='check-mark'>✓</span> cursor", t: 2.1 },
      { el: document.getElementById("module-3"), text: "<span class='check-mark'>✓</span> agentrouter", t: 2.7 }
    ];

    modules.forEach((mod, i) => {
      tl.to(mod.el, {
        opacity: 1,
        duration: 0.3,
        ease: "power2.out",
        onStart: () => {
          mod.el.innerHTML = mod.text;
        }
      }, mod.t);
    });

    // Scene 3: SYSTEM READY with glow bloom (3.4–4.859s)
    const readyGlow = document.getElementById("ready-glow");
    const readyText = document.getElementById("ready-text");

    // Kinetic beat slam entrance
    tl.fromTo(readyText, {
      scale: 1.4,
      filter: "blur(14px)",
      opacity: 0
    }, {
      scale: 1,
      filter: "blur(0px)",
      opacity: 1,
      duration: 0.45,
      ease: "power4.out"
    }, 3.4);

    // Glow bloom behind it
    tl.fromTo(readyGlow, {
      opacity: 0,
      scale: 0.85
    }, {
      opacity: 1,
      scale: 1,
      duration: 0.8,
      ease: "power2.out"
    }, 3.4);

    // Bounded breathe during hold
    const glowPhase = { p: 0 };
    const BREATHE_CYCLES = 1.5;
    const BREATHE_START = 4.2;
    const BREATHE_DUR = DURATION - BREATHE_START;

    tl.to(glowPhase, {
      p: Math.PI * 2 * BREATHE_CYCLES,
      duration: BREATHE_DUR,
      ease: "none",
      onUpdate: () => {
        const s = Math.sin(glowPhase.p);
        readyGlow.style.opacity = String(0.35 + s * 0.04);
        readyGlow.style.transform = `scale(${1 + s * 0.015})`;
      }
    }, BREATHE_START);

    // Subtle scale-open on the whole terminal stage
    tl.to(".terminal-stage", {
      scale: 1.008,
      duration: DURATION - 3.4,
      ease: "power1.out"
    }, 3.4);
  </script>
</template>
