  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function() {
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const wordmark = document.getElementById('c02-wordmark');
      const hub = document.getElementById('c02-hub');
      const tagline = document.getElementById('c02-tagline');
      const camera = document.getElementById('c02-camera');
      const connectors = document.getElementById('c02-connectors');
      const items = [
        document.getElementById('c02-orbit-0'),
        document.getElementById('c02-orbit-1'),
        document.getElementById('c02-orbit-2'),
        document.getElementById('c02-orbit-3')
      ];

      const RADIUS_X = 420;
      const RADIUS_Y = 250;

      // Initial state
      gsap.set(wordmark, { opacity: 0, scale: 0.7, y: 30 });
      gsap.set(hub, { opacity: 0, scale: 0.5 });
      gsap.set(connectors, { opacity: 0 });
      gsap.set(tagline, { opacity: 0, y: 20 });

      // Scene 1 (0.0-2.5s): Wordmark rises boldly
      tl.to(wordmark, {
        opacity: 1,
        scale: 1,
        y: 0,
        duration: 1.2,
        ease: "power3.out"
      }, 0.2);

      tl.to(wordmark, {
        textShadow: "0 0 70px rgba(217, 119, 6, 0.8)",
        duration: 0.8,
        repeat: 1,
        yoyo: true,
        ease: "sine.inOut"
      }, 0.6);

      // Scene 2 (2.5-6.5s): Wordmark morphs to Hub & Constellation orbits expand
      tl.to(wordmark, {
        opacity: 0,
        scale: 0.8,
        duration: 0.6,
        ease: "power2.in"
      }, 2.5);

      tl.to(hub, {
        opacity: 1,
        scale: 1,
        duration: 0.8,
        ease: "back.out(1.7)"
      }, 2.8);

      tl.to(connectors, {
        opacity: 1,
        duration: 0.4
      }, 3.0);

      // Lines draw out
      const lines = [
        document.getElementById('c02-line-0'),
        document.getElementById('c02-line-1'),
        document.getElementById('c02-line-2'),
        document.getElementById('c02-line-3')
      ];
      lines.forEach((line, i) => {
        tl.to(line, {
          strokeDashoffset: 0,
          duration: 0.8,
          ease: "power2.out"
        }, 3.0 + i * 0.1);
      });

      // Orbit items fan out to 4 cardinal directions
      const angles = [0, Math.PI / 2, Math.PI, 3 * Math.PI / 2];
      items.forEach((item, i) => {
        const targetX = Math.cos(angles[i]) * RADIUS_X;
        const targetY = -Math.sin(angles[i]) * RADIUS_Y;

        gsap.set(item, { x: 0, y: 0, opacity: 0, scale: 0.3 });
        tl.to(item, {
          x: targetX,
          y: targetY,
          opacity: 1,
          scale: 1,
          duration: 1.0,
          ease: "power3.out"
        }, 3.2 + i * 0.1);
      });

      // Tagline emerges
      tl.to(tagline, {
        opacity: 1,
        y: 0,
        duration: 0.8,
        ease: "power2.out"
      }, 4.2);

      // Camera slow cinematic push
      tl.to(camera, {
        scale: 1.08,
        duration: 12.8,
        ease: "none"
      }, 0);

      window.__timelines['02-logo-constellation'] = tl;
    })();
  </script>
