  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function() {
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const wordmark = document.getElementById('02-logo-constellation-wordmark');
      const hub = document.getElementById('02-logo-constellation-hub');
      const tagline = document.getElementById('02-logo-constellation-tagline');
      const camera = document.getElementById('02-logo-constellation-camera');
      const items = [
        document.getElementById('02-logo-constellation-orbit-0'),
        document.getElementById('02-logo-constellation-orbit-1'),
        document.getElementById('02-logo-constellation-orbit-2'),
        document.getElementById('02-logo-constellation-orbit-3')
      ];

      const RADIUS_X = 450;
      const RADIUS_Y = 270;

      // Scene 1 (0.0-2.2s): Wordmark assembles from depth-cloud
      const wordmarkGlyphs = wordmark.textContent.split('').map((char, i) => {
        const span = document.createElement('span');
        span.textContent = char;
        span.style.display = 'inline-block';
        span.style.willChange = 'transform, opacity';
        return span;
      });
      wordmark.innerHTML = '';
      wordmarkGlyphs.forEach(span => wordmark.appendChild(span));

      wordmarkGlyphs.forEach((span, i) => {
        // Deterministic pseudo-random values seeded by character index
        const seed1 = (i * 37.13) % 60 - 30;
        const seed2 = (i * 53.71) % 60 - 30;
        const seed3 = (i * 19.47) % 200;
        gsap.set(span, {
          opacity: 0,
          scale: 0.3,
          rotateX: seed1,
          rotateY: seed2,
          z: -200 - seed3
        });

        tl.to(span, {
          opacity: 1,
          scale: 1,
          rotateX: 0,
          rotateY: 0,
          z: 0,
          duration: 1.2,
          ease: 'power3.out'
        }, 0.2 + i * 0.04);
      });

      // Scene 2 (2.2-6.0s): Wordmark demotes, hub blooms, models enter orbit
      tl.to(wordmark, {
        scale: 0.25,
        y: -320,
        duration: 0.8,
        ease: 'power2.inOut'
      }, 2.2);

      gsap.set(hub, { opacity: 0, scale: 0.6 });
      tl.to(hub, {
        opacity: 1,
        scale: 1,
        duration: 0.7,
        ease: 'back.out(1.4)'
      }, 2.4);

      items.forEach((el, i) => {
        const angle = Number(el.dataset.angle);
        const a0 = (angle / 360) * Math.PI * 2;
        const startX = Math.cos(a0) * RADIUS_X;
        const startY = Math.sin(a0) * RADIUS_Y;

        gsap.set(el, {
          xPercent: -50,
          yPercent: -50,
          x: startX,
          y: startY,
          rotateX: -90,
          rotateY: 45,
          z: -300,
          opacity: 0,
          scale: 0.4
        });

        tl.to(el, {
          rotateX: 0,
          rotateY: 0,
          z: 0,
          opacity: 1,
          scale: 1,
          duration: 0.6,
          ease: 'back.out(1.6)'
        }, 2.8 + i * 0.12);

        const orbit = { p: 0 };
        tl.to(orbit, {
          p: 1,
          duration: 10.417,
          ease: 'none',
          onUpdate: () => {
            const a = a0 + orbit.p * Math.PI * 2;
            const x = Math.cos(a) * RADIUS_X;
            const y = Math.sin(a) * RADIUS_Y;
            const zIndex = 1 + Math.round(((y + RADIUS_Y) / (2 * RADIUS_Y)) * 49);
            el.style.zIndex = String(zIndex);
            el.style.transform = `translate(-50%, -50%) translate(${x}px, ${y}px)`;
          }
        }, 3.4 + i * 0.12);
      });

      // Scene 3 (6.0-9.6s): Connector lines draw, shimmer travels, hub pulses
      for (let i = 0; i < 4; i++) {
        const line = document.getElementById(`02-logo-constellation-line-${i}`);
        const shimmer = document.getElementById(`02-logo-constellation-shimmer-${i}`);
        const len = line.getTotalLength();

        gsap.set(line, {
          strokeDasharray: len,
          strokeDashoffset: len
        });

        tl.to(line, {
          strokeDashoffset: 0,
          duration: 0.7,
          ease: 'power2.out'
        }, 6.2 + i * 0.15);

        tl.fromTo(shimmer, {
          opacity: 0,
          attr: { cx: line.getAttribute('x2'), cy: line.getAttribute('y2') }
        }, {
          opacity: 1,
          duration: 0.1,
          ease: 'power1.in'
        }, 6.3 + i * 0.15);

        tl.to(shimmer, {
          attr: { cx: line.getAttribute('x1'), cy: line.getAttribute('y1') },
          duration: 0.6,
          ease: 'power1.inOut'
        }, 6.4 + i * 0.15);

        tl.to(shimmer, {
          opacity: 0,
          duration: 0.1,
          ease: 'power1.out'
        }, 6.9 + i * 0.15);
      }

      tl.to(hub, {
        scale: 1.15,
        duration: 0.3,
        ease: 'power2.out'
      }, 7.8);

      tl.to(hub, {
        scale: 1,
        duration: 0.4,
        ease: 'power2.inOut'
      }, 8.1);

      // Scene 4 (9.6-12.617s): Camera push-in, wordmark re-centers, tagline reveals
      const phase = { scale: 0.92 };

      tl.to(phase, {
        scale: 1.0,
        duration: 1.5,
        ease: 'power2.inOut'
      }, 2.2);

      tl.to(phase, {
        scale: 1.08,
        duration: 2.8,
        ease: 'power2.out'
      }, 9.6);

      const drift = { p: 0 };
      tl.to(drift, {
        p: Math.PI * 2 * 2,
        duration: 12.617,
        ease: 'none',
        onUpdate: () => {
          const dx = Math.sin(drift.p) * 3;
          const dy = Math.sin(drift.p * 1.3) * 2;
          camera.style.transform = `scale(${phase.scale}) translate(${dx}px, ${dy}px)`;
        }
      }, 0);

      tl.to(wordmark, {
        scale: 0.4,
        y: -80,
        duration: 1.2,
        ease: 'power2.inOut'
      }, 9.8);

      gsap.set(tagline, { opacity: 0, y: 20 });
      tl.to(tagline, {
        opacity: 1,
        y: 0,
        duration: 0.8,
        ease: 'power2.out'
      }, 11.0);

      window.__timelines["02-logo-constellation"] = tl;
    })();
  </script>
