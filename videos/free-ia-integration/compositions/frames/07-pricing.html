  <script>
    const tl = gsap.timeline({ paused: true });
    window.__timelines = window.__timelines || {};
    window.__timelines["07-pricing"] = tl;

    const DURATION = 13.401;
    const TILT = 11;
    const OVERSHOOT = 6;
    const SLIDE = 380;
    const ENTRY_DUR = 0.9;

    const leftCard = document.getElementById("p07-card-left");
    const rightCard = document.getElementById("p07-card-right");
    const stage = document.getElementById("p07-stage");
    const glow = document.getElementById("p07-glow");
    const badge = document.getElementById("p07-badge");
    const rule = document.getElementById("p07-rule");
    const seal = document.getElementById("p07-seal");
    const priceLeft = document.getElementById("p07-price-left");
    const lineLeft = document.getElementById("p07-line-left");
    const priceRight = document.getElementById("p07-price-right");
    const proLines = gsap.utils.toArray(".pro-line");

    // Glow hidden until Pro becomes focal (opacity/scale only — no CSS transform baked)
    gsap.set(glow, { opacity: 0, scale: 0.9 });

    // ---- Scene 1 (0.0-2.6s): mirrored book-open entrance (split-tilt-cards) ----
    // Signature move: two cards enter from opposite wings with mirrored rotationY tilts.
    tl.fromTo(leftCard,
      { x: -SLIDE, rotateY: TILT + OVERSHOOT, opacity: 0 },
      { x: 0, rotateY: TILT, opacity: 1, duration: ENTRY_DUR, ease: "power3.out" },
      0.15);
    tl.fromTo(rightCard,
      { x: SLIDE, rotateY: -TILT - OVERSHOOT, opacity: 0 },
      { x: 0, rotateY: -TILT, opacity: 1, duration: ENTRY_DUR, ease: "power3.out" },
      0.3);

    // Slight camera rotate (bounded sine, deterministic) — "caméra qui tourne légèrement"
    const cam = { p: 0 };
    tl.to(cam, {
      p: Math.PI * 2 * 1.25,
      duration: DURATION,
      ease: "none",
      onUpdate: () => { gsap.set(stage, { rotateY: Math.sin(cam.p) * 2.2 }); }
    }, 0);

    // Counter-phase idle bob via bounded sine (no yoyo/repeat — seek-safe)
    const bob = { p: 0 };
    const BOB_START = 1.5;
    const BOB_AMP = 5;
    tl.to(bob, {
      p: Math.PI * 2 * 3,
      duration: DURATION - BOB_START,
      ease: "none",
      onUpdate: () => {
        const s = Math.sin(bob.p);
        gsap.set(leftCard, { y: -s * BOB_AMP });
        gsap.set(rightCard, { y: s * BOB_AMP });
      }
    }, BOB_START);

    // ---- Scene 2 (2.6-6.4s): left card fills; right dims (depth-of-field-blur) ----
    tl.fromTo(priceLeft, { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 2.7);
    tl.fromTo(lineLeft, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 3.1);
    tl.to(rightCard, { "--dof": "9px", opacity: 0.5, duration: 0.8, ease: "power2.inOut" }, 3.2);

    // ---- Scene 3 (6.4-10.4s): rack focus to Pro; sequential value lines; badge pop ----
    // Rack: left blurs+dims, right sharpens (adjacent tweens on the same --dof channel).
    tl.to(leftCard, { "--dof": "9px", opacity: 0.55, duration: 0.8, ease: "power2.inOut" }, 6.5);
    tl.to(rightCard, { "--dof": "0px", opacity: 1, duration: 0.8, ease: "power2.inOut" }, 6.5);
    tl.to(glow, { opacity: 1, scale: 1, duration: 1.0, ease: "power2.out" }, 6.5);

    tl.fromTo(priceRight, { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 6.9);
    // Three value lines revealed one per spoken item (dynamic-content-sequencing cadence).
    tl.fromTo(proLines[0], { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 7.3);
    tl.fromTo(proLines[1], { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 8.2);
    tl.fromTo(proLines[2], { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 9.1);

    // Badge spring-pop (the voltage) — gentle overshoot allowed on this one playful beat.
    tl.fromTo(badge,
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.55, ease: "back.out(1.6)" },
      9.4);

    // Glow breathe during the Pro hold (opacity only, bounded, deterministic).
    const glowB = { p: 0 };
    const GB_START = 8.0;
    tl.to(glowB, {
      p: Math.PI * 2 * 2,
      duration: DURATION - GB_START,
      ease: "none",
      onUpdate: () => { glow.style.opacity = String(0.85 + Math.sin(glowB.p) * 0.1); }
    }, GB_START);

    // ---- Scene 4 (10.4-13.401s): both cards level & lit; seal line draws in; held ----
    tl.to(leftCard, { rotateY: 0, duration: 0.9, ease: "power3.inOut" }, 10.4);
    tl.to(rightCard, { rotateY: 0, duration: 0.9, ease: "power3.inOut" }, 10.4);
    // Refocus the left card so both read lit.
    tl.to(leftCard, { "--dof": "0px", opacity: 1, duration: 0.9, ease: "power2.inOut" }, 10.4);

    tl.fromTo(rule, { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power2.out" }, 10.7);
    tl.fromTo(seal, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 11.0);
  </script>
