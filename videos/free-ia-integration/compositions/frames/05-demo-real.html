  <div data-hf-id="hf-0q26" id="root" data-composition-id="05-demo-real" data-duration="10.374" data-width="1920" data-height="1080">

    <div data-hf-id="hf-c7hf" class="clip df-scene" data-start="0" data-duration="10.374" data-track-index="1">
      <div data-hf-id="hf-779u" class="df-camera" id="df-camera">
        <div data-hf-id="hf-gtty" class="df-window-stage">
          <div data-hf-id="hf-68uk" class="df-window" id="df-window">

          <div data-hf-id="hf-ex42" class="df-lockup-glow" id="df-lockup-glow"></div>
          <div data-hf-id="hf-6gtr" class="df-lockup-pre">&lt;&#160;</div>
          <div data-hf-id="hf-l0dy" class="df-lockup-figure" id="df-lockup-figure">0</div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });
    window.__timelines = window.__timelines || {};
    window.__timelines["05-demo-real"] = tl;

    const DURATION = 9.796;

    const glassWindow = document.getElementById("df-window");
    const camera = document.getElementById("df-camera");
    const windowContent = document.getElementById("df-window-content");
    const kicker = document.getElementById("df-kicker");
    const lockupStage = document.getElementById("df-lockup-stage");
    const lockupFigure = document.getElementById("df-lockup-figure");
    const lockupGlow = document.getElementById("df-lockup-glow");

    // ── Scene 1 (0.0–2.4s): window rises into a tilted floating glass window ──
    // Static 3D tilt via GSAP transform props (no raw CSS transform string — keeps
    // rotation, y and scale in one GSAP-managed matrix).
    gsap.set(glassWindow, { transformPerspective: 1400, rotationY: -8, rotationX: 4 });

    tl.fromTo(glassWindow, {
      y: 80,
      opacity: 0,
      scale: 0.92
    }, {
      y: 0,
      opacity: 1,
      scale: 1,
      duration: 1.0,
      ease: "power3.out"
    }, 0);

    // ── multi-phase-camera: gentle push (Phase 1 t0 → Phase 2 settle → Phase 3 push) ──
    const phase = { scale: 0.96 };

    tl.to(phase, { scale: 1.0, duration: 1.4, ease: "power2.out" }, 1.2);
    tl.to(phase, { scale: 1.07, duration: 3.596, ease: "power2.inOut" }, 6.2);

    // Continuous sine micro-drift — the single writer of camera.style.transform.
    const drift = { p: 0 };
    tl.to(drift, {
      p: Math.PI * 2 * 1.6,
      duration: DURATION,
      ease: "none",
      onUpdate: () => {
        const dx = Math.sin(drift.p) * 5;
        const dy = Math.sin(drift.p * 1.3) * 2.5;
        camera.style.transform = `scale(${phase.scale}) translate(${dx}px, ${dy}px)`;
      }
    }, 0);

    // ── Scene 2 (2.4–6.2s): internal scroll + kicker in the negative space ──
    // 3d-page-scroll internal scroll: pan the captured page down to the node-graph/CTA region.
    tl.to(windowContent, { y: -120, duration: 1.3, ease: "power3.out" }, 2.5);

    tl.fromTo(kicker, {
      opacity: 0,
      x: 34
    }, {
      opacity: 1,
      x: 0,
      duration: 0.6,
      ease: "power2.out"
    }, 3.3);

    // ── Scene 3 (6.2–9.796s): window settles flat, number lockup crystallizes ──
    // Flatten the tilt (GSAP rotation props — composes with the existing y/scale matrix).
    tl.to(glassWindow, {
      rotationY: 0,
      rotationX: 0,
      duration: 0.8,
      ease: "power2.inOut"
    }, 6.2);

    // ambient-glow-bloom behind the lockup — lands as one beat with the lockup settle.
    tl.fromTo(lockupGlow, {
      opacity: 0,
      scale: 0.82
    }, {
      opacity: 0.34,
      scale: 1,
      duration: 1.0,
      ease: "power2.out"
    }, 7.0);

    // Lockup enters (blur-in), then the figure counts up with a dynamic-scale grow.
    tl.fromTo(lockupStage, {
      opacity: 0,
      scale: 0.9,
      filter: "blur(8px)"
    }, {
      opacity: 1,
      scale: 1,
      filter: "blur(0px)",
      duration: 0.6,
      ease: "power4.out"
    }, 7.0);

    // counting-dynamic-scale: value counts 0→30 while the figure scales to full weight.
    const START_SIZE = 90, END_SIZE = 150;
    const counter = { n: 0 };
    tl.to(counter, {
      n: 30,
      duration: 1.3,
      ease: "power2.out",
      onUpdate: () => { lockupFigure.textContent = Math.round(counter.n); }
    }, 7.1);
    tl.fromTo(lockupFigure,
      { scale: START_SIZE / END_SIZE },
      { scale: 1, duration: 1.3, ease: "power2.out" },
      7.1);

    // Bounded breathe on the glow during the held close (never a yoyo loop).
    const glowPhase = { p: 0 };
    const BREATHE_START = 8.5;
    const BREATHE_DUR = DURATION - BREATHE_START;
    tl.to(glowPhase, {
      p: Math.PI * 2 * 1.0,
      duration: BREATHE_DUR,
      ease: "none",
      onUpdate: () => {
        const s = Math.sin(glowPhase.p);
        lockupGlow.style.opacity = String(0.34 + s * 0.04);
        lockupGlow.style.transform = `scale(${1 + s * 0.016})`;
      }
    }, BREATHE_START);
  </script>
