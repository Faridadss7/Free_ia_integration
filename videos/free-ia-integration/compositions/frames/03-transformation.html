<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
(function () {
  const tl = gsap.timeline({ paused: true });

  const world    = document.getElementById("03-transformation-world");
  const terminal = document.getElementById("03-transformation-terminal");
  const cmdSpan  = document.getElementById("03-transformation-cmd");
  const cursor   = document.getElementById("03-transformation-cursor");
  const streak   = document.getElementById("03-transformation-streak");
  const voltage  = document.getElementById("03-transformation-voltage");

  const fragments = [];
  for (let i = 1; i <= 9; i++) fragments.push(document.getElementById("03-transformation-frag-" + i));

  // ── Camera: one state object, one writer, fixed transform order ──
  const cam = { x: 0, y: 0, z: -220, rx: 0, ry: 0 };
  function applyCamera() {
    world.style.transform =
      "translate3d(" + cam.x + "px," + cam.y + "px," + cam.z + "px) rotateX(" + cam.rx + "deg) rotateY(" + cam.ry + "deg)";
  }
  applyCamera(); // seed frame 0 so a seek to t=0 renders the opening wide pose

  // Center the terminal pill via GSAP transform props (kept off CSS to avoid
  // a transform conflict with the scale tweens below).
  tl.set(terminal, { xPercent: -50, yPercent: -50 }, 0);
  tl.set(streak, { xPercent: -50, yPercent: -50 }, 0);

  // ── SCENE 1 (0.0–2.0s): terminal, type-on, Enter detonation ──
  tl.fromTo(cursor, { opacity: 0 }, { opacity: 1, duration: 0.05 }, 0.25);

  // Type-on driven by a numeric tween (onUpdate) so every seeked frame is
  // deterministic — tl.call callbacks can be skipped under frame-by-frame seeks.
  const commandText = "free-ai init";
  const typer = { n: 0 };
  tl.fromTo(typer,
    { n: 0 },
    {
      n: commandText.length,
      duration: 0.9,
      ease: "none",
      onUpdate: function () { cmdSpan.textContent = commandText.slice(0, Math.round(typer.n)); }
    },
    0.32);

  // Cursor blink after the line is typed
  tl.to(cursor, { opacity: 0, duration: 0.12 }, 1.4)
    .to(cursor, { opacity: 1, duration: 0.12 }, 1.55)
    .to(cursor, { opacity: 0, duration: 0.12 }, 1.7);

  // Enter beat: tactile press then release + coral glow
  tl.to(terminal, { scale: 0.975, duration: 0.09, ease: "power2.in" }, 1.82)
    .to(terminal, {
      scale: 1.025,
      boxShadow: "0 0 22px rgba(56,189,248,0.55), 0 4px 16px rgba(3,7,18,0.04)",
      duration: 0.16, ease: "power2.out"
    }, 1.91)
    .to(terminal, {
      scale: 1,
      boxShadow: "0 1px 3px rgba(3,7,18,0.08), 0 4px 16px rgba(3,7,18,0.04)",
      duration: 0.3, ease: "power2.out"
    }, 2.07);

  // Directional velocity streak fires outward from the pill
  tl.fromTo(streak,
    { opacity: 0, scaleX: 1, scaleY: 1 },
    { opacity: 0.9, scaleX: 420, scaleY: 1, duration: 0.22, ease: "power3.out" }, 1.9)
   .to(streak, { opacity: 0, scaleX: 900, duration: 0.35, ease: "power2.out" }, 2.12);

  // ── LEG 1 — camera dive begins on the Enter beat (power4.out) ──
  tl.fromTo(cam,
    { x: 0, y: 0, z: -220, rx: 0, ry: 0 },
    { x: 0, y: 40, z: 320, rx: 26, ry: 0, duration: 0.75, ease: "power4.out", onUpdate: applyCamera },
    1.85);

  // Terminal hands off — fades as the world explodes into fragments
  tl.to(terminal, { opacity: 0, duration: 0.4, ease: "power2.in" }, 2.0);

  // ── SCENE 2 (2.0–5.2s): fragments scatter in a 3D depth-cloud; camera flies past ──
  const scatter = [
    { x: -450, y: -260, z: 180, rx: -15, ry:  20 },
    { x:  380, y: -180, z: 200, rx:  10, ry: -25 },
    { x: -280, y:  120, z:  90, rx: -25, ry:  15 },
    { x:  440, y:  180, z: 200, rx:  15, ry: -30 },
    { x: -200, y:  280, z: 190, rx:  20, ry:  10 },
    { x:  500, y: -100, z: 140, rx: -10, ry:  25 },
    { x: -380, y:  330, z: 200, rx:  18, ry: -15 },
    { x:  220, y: -300, z: 170, rx: -20, ry:  18 },
    { x:  340, y:  300, z: 200, rx:  12, ry: -20 }
  ];

  fragments.forEach(function (frag, i) {
    const s = scatter[i];
    const depth = parseInt(frag.dataset.depth, 10);
    // Appear at the scatter pose (fromTo seeds a deterministic start).
    tl.fromTo(frag,
      { opacity: 0, scale: 0.82, xPercent: -50, yPercent: -50, x: s.x * 0.6, y: s.y * 0.6, z: s.z * 0.5, rotationX: s.rx, rotationY: s.ry },
      { opacity: 1, scale: 1, x: s.x, y: s.y, z: s.z, duration: 0.55, ease: "power2.out" },
      2.0 + i * 0.05);
    // Depth-of-field blur on non-focal planes (leaf elements only).
    tl.to(frag, { "--dof": (depth * 4) + "px", duration: 0.6, ease: "power2.out" }, 2.0 + i * 0.05);
  });

  // ── LEG 2 — continuous flight through the chaos (power2.inOut cruise) ──
  tl.to(cam, { x: -90, y: -40, z: 380, rx: 33, ry: -8, duration: 2.2, ease: "power2.inOut", onUpdate: applyCamera }, 2.6);

  // ── SCENE 3 (5.2–8.725s): tilt-to-flatten landing; fragments snap to grid ──
  // LEG 3 — decelerate to a flat overview (power4.out landing).
  tl.to(cam, { x: 0, y: 0, z: 0, rx: 0, ry: 0, duration: 1.6, ease: "power4.out", onUpdate: applyCamera }, 5.0);

  // Final workspace grid (screen-space offsets from center; all within keep-out y<=900).
  // Column-partitioned so no two panes share horizontal band + vertical band:
  // left column (x≈-600), center column (x≈-40), right column (x≈600); the bottom
  // strip sits alone in the center column's lower slot, clear of every editor pane.
  const grid = [
    { x: -600, y: -300 }, // 1 editor (main.py)   — left top
    { x:  600, y: -320 }, // 2 agent               — right top
    { x:  -40, y: -320 }, // 3 tree                — center top
    { x:  600, y:  -40 }, // 4 chart               — right mid
    { x: -600, y:   40 }, // 5 editor (config.json)— left mid
    { x:  600, y:  240 }, // 6 panel               — right lower
    { x:  -40, y:  280 }, // 7 strip               — center bottom (alone)
    { x:  -40, y:  -30 }, // 8 editor (agent.py)   — center mid
    { x: -600, y:  310 }  // 9 chart               — left lower
  ];


  fragments.forEach(function (frag, i) {
    const g = grid[i];
    tl.to(frag, { x: g.x, y: g.y, z: 0, rotationX: 0, rotationY: 0, duration: 1.4, ease: "power4.out" }, 5.2);
    tl.to(frag, { "--dof": "0px", duration: 1.4, ease: "power4.out" }, 5.2);
  });

  // "prêt à coder" — the single voltage line draws on under the composed workspace, then holds.
  tl.fromTo(voltage,
    { opacity: 0, scaleX: 0 },
    { opacity: 1, scaleX: 1, duration: 0.8, ease: "power2.out" },
    7.4);

  // Locked landing dwell to the end of the shot.
  tl.to({}, { duration: 0.4 }, 8.3);

  window.__timelines = window.__timelines || {};
  window.__timelines["03-transformation"] = tl;
})();
</script>
