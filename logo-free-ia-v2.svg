<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="300" fill="#FFFFFF"/>

  <!-- Badge / monogramme -->
  <rect x="50" y="70" width="140" height="140" rx="32" fill="#5B5FEF"/>

  <!-- Lettre F geometrique augmentee de deux noeuds relies (integration + IA) -->
  <g>
    <rect x="84" y="102" width="16" height="76" rx="4" fill="#FFFFFF"/>
    <rect x="84" y="102" width="50" height="16" rx="4" fill="#FFFFFF"/>
    <rect x="84" y="134" width="38" height="16" rx="4" fill="#FFFFFF"/>
    <path d="M140,110 Q162,126 128,142" stroke="#FFFFFF" stroke-width="3" fill="none" opacity="0.55" stroke-linecap="round"/>
    <circle cx="140" cy="110" r="9" fill="#14B8A6"/>
    <circle cx="128" cy="142" r="7" fill="#14B8A6"/>
  </g>

  <!-- Eyebrow / tag -->
  <text x="220" y="100" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#14B8A6">FORMATION IA</text>

  <!-- Wordmark -->
  <text x="218" y="158" font-family="Helvetica, Arial, sans-serif" font-size="62" font-weight="800" letter-spacing="-1">
    <tspan fill="#0B0E1A">free</tspan><tspan fill="#5B5FEF">IA</tspan>
  </text>

  <text x="220" y="187" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="600" letter-spacing="7" fill="#6B7280">INTEGRATION</text>

  <!-- Ligne de separation -->
  <line x1="50" y1="232" x2="850" y2="232" stroke="#E5E7EB" stroke-width="1.5"/>

  <!-- Tagline -->
  <text x="50" y="258" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#6B7280">Apprendre l'IA. L'integrer a votre carriere.</text>
</svg>
